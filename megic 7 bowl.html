<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magic 7 Ball</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #1e1e2f, #0f0f1a); color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
.container { text-align: center; max-width: 400px; width: 100%; }
h1 { font-size: 2.5rem; margin-bottom: 10px; color: #a29bfe; text-shadow: 0 0 10px rgba(162, 155, 254, 0.3); }
p { font-size: 1rem; color: #b2bec3; margin-bottom: 25px; }
.input-group { margin-bottom: 30px; }
input[type="text"] { width: 100%; padding: 12px 20px; font-size: 1rem; border: 2px solid #4834d4; border-radius: 25px; background-color: #131324; color: #fff; outline: none; transition: border-color 0.3s, box-shadow 0.3s; }
input[type="text"]:focus { border-color: #6c5ce7; box-shadow: 0 0 15px rgba(108, 92, 231, 0.4); }
.ball-wrapper { position: relative; width: 280px; height: 280px; margin: 0 auto 30px auto; }
.eight-ball { width: 100%; height: 100%; background: radial-gradient(circle at 30% 30%, #454545, #111111 40%, #000000); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6), inset 0 -10px 20px rgba(0,0,0,0.5); position: relative; cursor: pointer; }
.shake { animation: shakeBall 0.5s ease-in-out; }
.window { width: 130px; height: 130px; background: radial-gradient(circle, #001233, #000814); border: 6px solid #222; border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; box-shadow: inset 0 0 15px rgba(0,0,0,0.8); }
.triangle-overlay { width: 0; height: 0; border-left: 50px solid transparent; border-right: 50px solid transparent; border-bottom: 86.6px solid #000814; position: absolute; z-index: 1; }
.eight-logo { font-size: 4.5rem; font-weight: bold; color: #ffffff; text-shadow: 1px 1px 5px rgba(0,0,0,0.5); z-index: 2; transition: opacity 0.3s; }
.answer-text { font-size: 0.75rem; font-weight: 700; color: #79a6fe; text-align: center; text-transform: uppercase; width: 80px; line-height: 1.3; z-index: 3; opacity: 0; transform: scale(0.6); transition: opacity 0.8s ease-out, transform 0.8s ease-out; }
.fade-in { opacity: 1; transform: scale(1); text-shadow: 0 0 8px rgba(121, 166, 254, 0.6); }
button { background: linear-gradient(135deg, #6c5ce7, #4834d4); color: white; border: none; padding: 12px 35px; font-size: 1.1rem; font-weight: bold; border-radius: 25px; cursor: pointer; box-shadow: 0 5px 15px rgba(72, 52, 212, 0.4); transition: transform 0.2s, box-shadow 0.2s; }
button:hover { transform: translateY(-2px); box-shadow: 0 7px 20px rgba(72, 52, 212, 0.6); }
button:active { transform: translateY(1px); }
@keyframes shakeBall {
  0% { transform: translate(0, 0) rotate(0deg); }
  15% { transform: translate(-8px, 4px) rotate(-5deg); }
  30% { transform: translate(8px, -4px) rotate(5deg); }
  45% { transform: translate(-6px, -2px) rotate(-3deg); }
  60% { transform: translate(6px, 4px) rotate(3deg); }
  75% { transform: translate(-4px, 2px) rotate(-1deg); }
  90% { transform: translate(2px, -2px) rotate(1deg); }
  100% { transform: translate(0, 0) rotate(0deg); }
}
</style>
</head>
<body>
<div class="container">
  <h1>Magic 7 Ball</h1>
  <p>Ask a yes-or-no question, then shake the ball for answers.</p>
  <div class="input-group">
    <input type="text" id="question-input" placeholder="Type your question here..." autocomplete="off">
  </div>
  <div class="ball-wrapper">
    <div class="eight-ball" id="ball-click-target">
      <div class="window">
        <div class="triangle-overlay"></div>
        <div class="eight-logo" id="logo-text">7</div>
        <div class="answer-text" id="fortune-output"></div>
      </div>
    </div>
  </div>
  <button id="shake-btn">Shake Ball</button>
</div>

<script>
const answers = [
  "yes",
  "no",
  "prob",
  "prob not",
  "maybe",
  "idk",
  "why u askin me",
  "srry i didnt hear u",
  "errror 404",
  "nope",
  "yep",
  "absolutely",
  "ABSOLUTELY NOT",
  "nyeh hehehehehe",
  "maybe yes",
  "maybe no",
  "not happinin",
  "yes happinin",
  "trust me bro",
  "hahahah",
  "i got this",
  "im tired"
];

const ball = document.getElementById('ball-click-target');
const shakeBtn = document.getElementById('shake-btn');
const questionInput = document.getElementById('question-input');
const logoText = document.getElementById('logo-text');
const fortuneOutput = document.getElementById('fortune-output');
let isShaking = false;

window.onload = () => {
    alert("were u expecting my brother the magic 8 balll?");
};

function getPrediction() {
  if (isShaking) return;
  if (questionInput.value.trim() === "") {
    alert("bro ya gotta ask me a question first");
    return;
  }
  
  isShaking = true;
  fortuneOutput.classList.remove('fade-in');
  logoText.style.opacity = '1';
  ball.classList.add('shake');
  
  setTimeout(() => {
    ball.classList.remove('shake');
    const randomIndex = Math.floor(Math.random() * answers.length);
    const selection = answers[randomIndex];
    
    fortuneOutput.innerHTML = selection.replace(/\n/g, '<br>');
    logoText.style.opacity = '0';
    fortuneOutput.classList.add('fade-in');
    isShaking = false;
  }, 500);
}

shakeBtn.addEventListener('click', getPrediction);
ball.addEventListener('click', getPrediction);
questionInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') {
    getPrediction();
  }
});
</script>
</body>
</html>
